<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>2人対戦ゲームコレクション</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Jost:wght@500;600;700&display=swap');

  :root{
    --hairline: rgba(255,255,255,0.14);
    --silver: #cfcfcf;
    --silver-dim: #6f6f6f;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 55%, #000000 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--silver);
    display:flex;
    justify-content:center;
    padding: 40px 16px 60px;
  }

  .app{
    width:100%;
    max-width: 460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  header{ text-align:center; }
  h1{
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    letter-spacing: 0.08em;
    margin:0;
    color:#fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.12);
  }
  h1 .small{
    display:block;
    font-size:0.58rem;
    letter-spacing:0.4em;
    font-weight:500;
    color:var(--silver-dim);
    margin-top:10px;
    text-transform: uppercase;
  }

  .list{
    width:100%;
    border-top: 1px solid var(--hairline);
  }
  .item{
    display:flex;
    align-items:center;
    gap:16px;
    padding: 18px 6px;
    border-bottom: 1px solid var(--hairline);
    text-decoration:none;
    color:#fff;
    transition: background .15s ease, padding-left .15s ease;
  }
  .item:hover{ background: rgba(255,255,255,0.04); padding-left: 12px; }
  .item .num{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    color: var(--silver-dim);
    width: 24px;
    flex-shrink:0;
  }
  .item .title{
    font-family:'Kaisei Decol', serif;
    font-size: 1.02rem;
    letter-spacing: 0.04em;
    flex:1;
  }
  .item .arrow{
    color: var(--silver-dim);
    font-size:0.95rem;
    transition: transform .15s ease;
  }
  .item:hover .arrow{ transform: translateX(4px); color:#fff; }

  footer{
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.06em;
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>対戦ゲーム集<span class="small">10 Two-Player Games</span></h1>
  </header>

  <nav class="list">
    <a class="item" href="mini_shogi.html"><span class="num">01</span><span class="title">ミニ将棋</span><span class="arrow">→</span></a>
    <a class="item" href="connect_four.html"><span class="num">02</span><span class="title">コネクトフォー</span><span class="arrow">→</span></a>
    <a class="item" href="hit_and_blow.html"><span class="num">03</span><span class="title">ヒット＆ブロー</span><span class="arrow">→</span></a>
    <a class="item" href="gomoku.html"><span class="num">04</span><span class="title">五目並べ</span><span class="arrow">→</span></a>
    <a class="item" href="blackjack.html"><span class="num">05</span><span class="title">ブラックジャック</span><span class="arrow">→</span></a>
    <a class="item" href="counting_duel.html"><span class="num">06</span><span class="title">積み木カウント</span><span class="arrow">→</span></a>
    <a class="item" href="dice21.html"><span class="num">07</span><span class="title">ダイス21</span><span class="arrow">→</span></a>
    <a class="item" href="doubt_game.html"><span class="num">08</span><span class="title">ダウト</span><span class="arrow">→</span></a>
    <a class="item" href="dots_and_boxes.html"><span class="num">09</span><span class="title">ドット＆ボックス</span><span class="arrow">→</span></a>
    <a class="item" href="werewolf2.html"><span class="num">10</span><span class="title">2人人狼</span><span class="arrow">→</span></a>
  </nav>

  <footer>index.html と10個のゲームファイルを同じフォルダに入れてお使いください</footer>

</div>
</body>
</html>

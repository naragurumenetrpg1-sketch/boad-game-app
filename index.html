<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2人対戦ゲームコレクション</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Jost:wght@500;600;700&display=swap');

  :root{
    --hairline: rgba(255,255,255,0.14);
    --silver: #cfcfcf;
    --silver-dim: #6f6f6f;
  }

  *{ box-sizing:border-box; }

  html{
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
  }

  body{
    margin:0;
    min-height:100vh;
    height:100vh;
    overflow:hidden;
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 55%, #000000 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--silver);
    display:flex;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  .app{
  width:100%;
  max-width: 460px;
  display:none;   /* ← flex から none に変更 */
  flex-direction:column;
  align-items:center;
  gap:28px;
}

  header{ text-align:center; }
  h1{
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    letter-spacing: 0.08em;
    margin:0;
    color:#fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.12);
  }
  h1 .small{
    display:block;
    font-size:0.58rem;
    letter-spacing:0.4em;
    font-weight:500;
    color:var(--silver-dim);
    margin-top:10px;
    text-transform: uppercase;
  }

  /* --- swipeable pages: each .game-page is one full-width "screen" --- */
  .game-grid{
    width:100%;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action: pan-x; /* このエリアだけ横スワイプを許可 */
  }

  .game-grid::-webkit-scrollbar{
    display:none;
  }

  /* 1ページ = 画面幅いっぱい。中を2列×3行のグリッドにして最大6枚を表示 */
  .game-page{
    flex: 0 0 100%;
    width:100%;
    scroll-snap-align: start;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 108px); /* 行の高さを固定してページ間でカードサイズを揺らさない */
    align-content: start;
    gap: 10px;
    padding: 2px 4px;
  }

  .game-card{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:8px;
    padding: 12px 12px 10px;
    background: linear-gradient(160deg, #202020, #101010 55%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    text-decoration:none;
    color:#fff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .game-card:hover{
    transform: translateY(-3px);
    border-color: var(--silver-dim);
    box-shadow: 0 10px 20px rgba(0,0,0,0.55);
  }
  .game-card .num{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.05em;
  }
  .game-card .title{
    font-family:'Kaisei Decol', serif;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    line-height:1.3;
  }
  .game-card .tags{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .game-card .tag{
    font-size:0.56rem;
    letter-spacing:0.04em;
    color: var(--silver-dim);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 2px 7px;
  }
  .game-card .tag.cpu{ color:#dcd6c0; border-color: rgba(220,214,192,0.35); }
  .game-card .tag.master{ color:#fff; border-color: rgba(255,255,255,0.5); }

  /* ページ位置を示すドット */
  .page-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:4px;
  }
  .page-dots .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--hairline);
    transition: background .15s ease, transform .15s ease;
  }
  .page-dots .dot.active{
    background:#fff;
    transform: scale(1.2);
  }

  footer{
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.06em;
    text-align:center;
  }
#opening{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#openingVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* --- tap to start screen (OP動画の後に表示) --- */
#startScreen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:10000;
  display:none;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
#startScreen .tap-text{
  font-family:'Kaisei Decol', serif;
  font-weight:500;
  color:#fff;
  font-size: clamp(0.9rem, 4.5vw, 1.15rem);
  letter-spacing:0.35em;
  text-transform:uppercase;
  animation: tapBlink 1.8s ease-in-out infinite;
}
@keyframes tapBlink{
  0%, 100%{ opacity:1; }
  50%{ opacity:0.2; }
}

  /* --- bonus tools --- */
  .extras{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .extras-heading{
    font-size:0.62rem;
    letter-spacing:0.3em;
    color: var(--silver-dim);
    text-transform:uppercase;
    text-align:center;
    margin-bottom: 2px;
  }
  .icon-toggle-row{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .tool-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    font-size:1.4rem;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-toggle:hover{ background: rgba(255,255,255,0.07); border-color: var(--silver-dim); }
  .tool-toggle.open{ background:#fff; border-color:#fff; }

  .tool-panel{
    width:100%;
    background: linear-gradient(160deg, #202020, #141414 45%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px 18px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .tool-panel.open{ display:flex; }

  .count-row{ display:flex; gap:8px; }
  .count-btn{
    width:36px; height:36px;
    border-radius:50%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    transition: all .15s ease;
  }
  .count-btn.active{ background:#fff; color:#141414; border-color:#fff; }

  .dice-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:58px; }
  .die{
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    border-radius: 9px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 7px;
  }
  .die.rolling{ animation: tumble 0.5s ease; }
  @keyframes tumble{
    0%{ transform: rotate(0deg) scale(1); }
    30%{ transform: rotate(120deg) scale(1.08); }
    60%{ transform: rotate(240deg) scale(0.94); }
    100%{ transform: rotate(360deg) scale(1); }
  }
  .pip{ width:7px; height:7px; border-radius:50%; background:#17130c; justify-self:center; align-self:center; opacity:0; }
  .pip.on{ opacity:1; }

  .dice-sum{ font-family:'Jost', sans-serif; font-size:0.78rem; color: var(--silver-dim); }
  .dice-sum b{ color:#fff; font-size:1rem; }

  .coin-wrap{ perspective: 600px; }
  .coin{
    width:84px; height:84px;
    border-radius:50%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.3,1);
  }
  .coin-face{
    position:absolute; inset:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size:1.1rem;
    backface-visibility: hidden;
  }
  .coin-face.heads{
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    color:#141414;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 8px 14px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
  }
  .coin-face.tails{
    background: linear-gradient(180deg, #4a4a4a, #000000);
    color:#f2efe6;
    transform: rotateY(180deg);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 8px 14px rgba(0,0,0,0.5), inset 0 0 0 1px #6f6f6f;
  }

  .coin-result{ font-size:0.8rem; color:#fff; letter-spacing:0.06em; min-height:1.2em; }

  .tool-btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.1em;
    color:#fff;
    background: transparent;
    border: 1px solid var(--silver-dim);
    border-radius:2px;
    padding: 11px 26px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-btn:hover{ background: rgba(255,255,255,0.06); border-color:#fff; }
  .tool-btn:active{ transform: translateY(1px); }
</style>
</head>
<body>

<div id="opening">
  <video id="openingVideo" autoplay muted playsinline>
    <source src="opening.mp4" type="video/mp4">
  </video>
</div>

<div id="startScreen">
  <div class="tap-text">タップしてスタート</div>
</div>

<div class="app">

  <header>
    <h1>hitotoki-対戦ゲーム集-<span class="small">10 Two-Player Games</span></h1>
  </header>

  <nav class="game-grid" id="gameGrid">
    <div class="game-page">
      <a class="game-card" href="mini_shogi.html">
        <div><div class="num">01</div><div class="title">ミニ将棋</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span><span class="tag master">達人</span></div>
      </a>
      <a class="game-card" href="connect_four.html">
        <div><div class="num">02</div><div class="title">コネクトフォー</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span><span class="tag master">達人</span></div>
      </a>
      <a class="game-card" href="hit_and_blow.html">
        <div><div class="num">03</div><div class="title">ヒット＆ブロー</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span><span class="tag master">達人</span></div>
      </a>
      <a class="game-card" href="gomoku.html">
        <div><div class="num">04</div><div class="title">五目並べ</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span><span class="tag master">達人</span></div>
      </a>
      <a class="game-card" href="blackjack.html">
        <div><div class="num">05</div><div class="title">ブラックジャック</div></div>
        <div class="tags"><span class="tag cpu">ディーラー戦</span></div>
      </a>
      <a class="game-card" href="counting_duel.html">
        <div><div class="num">06</div><div class="title">積み木カウント</div></div>
        <div class="tags"><span class="tag">2人</span></div>
      </a>
    </div>

    <div class="game-page">
      <a class="game-card" href="dice21.html">
        <div><div class="num">07</div><div class="title">ダイス21</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span></div>
      </a>
      <a class="game-card" href="doubt_game.html">
        <div><div class="num">08</div><div class="title">ダウト</div></div>
        <div class="tags"><span class="tag">2人</span><span class="tag cpu">CPU</span></div>
      </a>
      <a class="game-card" href="dots_and_boxes.html">
        <div><div class="num">09</div><div class="title">ドット＆ボックス</div></div>
        <div class="tags"><span class="tag">2人</span></div>
      </a>
      <a class="game-card" href="werewolf2.html">
        <div><div class="num">10</div><div class="title">2人人狼</div></div>
        <div class="tags"><span class="tag">2人</span></div>
      </a>
    </div>
  </nav>

  <div class="page-dots" id="pageDots"></div>

  <div class="extras">
    <div class="extras-heading">おまけ機能</div>

    <div class="icon-toggle-row">
      <div class="tool-toggle" id="diceToggle" title="サイコロを振る">🎲</div>
      <div class="tool-toggle" id="coinToggle" title="コイントスする">🪙</div>
    </div>

    <div class="tool-panel" id="dicePanel">
      <div class="count-row" id="diceCountRow"></div>
      <div class="dice-row" id="diceRow"></div>
      <div class="dice-sum" id="diceSum"></div>
      <button class="tool-btn" id="diceRollBtn">振る</button>
    </div>

    <div class="tool-panel" id="coinPanel">
      <div class="coin-wrap">
        <div class="coin" id="coin">
          <div class="coin-face heads">表</div>
          <div class="coin-face tails">裏</div>
        </div>
      </div>
      <div class="coin-result" id="coinResult">投げてみましょう</div>
      <button class="tool-btn" id="coinFlipBtn">投げる</button>
    </div>
  </div>

</div>

<script>
(function(){
  // ピンチズームの保険（Safari対策）
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  const PIP_PATTERNS = {
    1: [5], 2: [1,9], 3: [1,5,9], 4: [1,3,7,9], 5: [1,3,5,7,9], 6: [1,3,4,6,7,9],
  };

  function setupToggle(toggleId, panelId, otherToggleId, otherPanelId){
    const toggle = document.getElementById(toggleId);
    const panel = document.getElementById(panelId);
    const otherToggle = document.getElementById(otherToggleId);
    const otherPanel = document.getElementById(otherPanelId);
    toggle.addEventListener('click', () => {
      const willOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', willOpen);
      toggle.classList.toggle('open', willOpen);
      if(willOpen){
        otherPanel.classList.remove('open');
        otherToggle.classList.remove('open');
      }
    });
  }
  setupToggle('diceToggle', 'dicePanel', 'coinToggle', 'coinPanel');
  setupToggle('coinToggle', 'coinPanel', 'diceToggle', 'dicePanel');

  // --- dice roller ---
  let diceCount = 2;
  let diceRolling = false;

  function renderDiceCountButtons(){
    const row = document.getElementById('diceCountRow');
    row.innerHTML = '';
    for(let n=1; n<=5; n++){
      const btn = document.createElement('button');
      btn.className = 'count-btn' + (n === diceCount ? ' active' : '');
      btn.textContent = n;
      btn.addEventListener('click', () => {
        diceCount = n;
        renderDiceCountButtons();
        renderDiceFaces(Array(diceCount).fill(0));
      });
      row.appendChild(btn);
    }
  }

  function renderDiceFaces(values){
    const row = document.getElementById('diceRow');
    row.innerHTML = '';
    values.forEach(v => {
      const die = document.createElement('div');
      die.className = 'die';
      for(let i=1;i<=9;i++){
        const p = document.createElement('div');
        p.className = 'pip';
        if((PIP_PATTERNS[v] || []).includes(i)) p.classList.add('on');
        die.appendChild(p);
      }
      row.appendChild(die);
    });
    const sumEl = document.getElementById('diceSum');
    const total = values.reduce((a,b) => a+b, 0);
    sumEl.innerHTML = values.some(v => v > 0) ? ('合計 <b>' + total + '</b>') : '';
  }

  document.getElementById('diceRollBtn').addEventListener('click', () => {
    if(diceRolling) return;
    diceRolling = true;
    document.getElementById('diceRollBtn').disabled = true;

    let flickers = 0;
    const iv = setInterval(() => {
      const randomValues = Array.from({length:diceCount}, () => Math.floor(Math.random()*6)+1);
      renderDiceFaces(randomValues);
      document.querySelectorAll('#diceRow .die').forEach(d => {
        d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('rolling');
      });
      flickers++;
      if(flickers > 5){
        clearInterval(iv);
        diceRolling = false;
        document.getElementById('diceRollBtn').disabled = false;
      }
    }, 90);
  });

  renderDiceCountButtons();
  renderDiceFaces(Array(diceCount).fill(0));

  // --- coin flip ---
  let coinFlipping = false;
  let coinRotation = 0;

  document.getElementById('coinFlipBtn').addEventListener('click', () => {
    if(coinFlipping) return;
    coinFlipping = true;
    document.getElementById('coinFlipBtn').disabled = true;
    document.getElementById('coinResult').textContent = '';

    const isHeads = Math.random() < 0.5;
    const extraSpins = 4;
    coinRotation += extraSpins * 360 + (isHeads ? 0 : 180);
    const coin = document.getElementById('coin');
    coin.style.transform = 'rotateY(' + coinRotation + 'deg)';

    setTimeout(() => {
      document.getElementById('coinResult').textContent = isHeads ? '表が出ました' : '裏が出ました';
      coinFlipping = false;
      document.getElementById('coinFlipBtn').disabled = false;
    }, 1000);
});

  // --- page dots (swipe position indicator) ---
  const gameGrid = document.getElementById('gameGrid');
  const pages = gameGrid.querySelectorAll('.game-page');
  const dotsWrap = document.getElementById('pageDots');
  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dotsWrap.appendChild(dot);
  });
  const dots = dotsWrap.querySelectorAll('.dot');

  function updateActiveDot(){
    const pageWidth = gameGrid.clientWidth;
    const idx = Math.round(gameGrid.scrollLeft / pageWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  }
  gameGrid.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateActiveDot);
  }, { passive: true });

    const opening = document.getElementById("opening");
  const openingVideo = document.getElementById("openingVideo");
  const startScreen = document.getElementById("startScreen");
  const app = document.querySelector(".app");

  function showStartScreen(){
    opening.style.display = "none";
    startScreen.style.display = "flex";
  }

  openingVideo.addEventListener("ended", showStartScreen);

  opening.addEventListener("click", () => {
    openingVideo.pause();
    showStartScreen();
  });

  startScreen.addEventListener("click", () => {
    startScreen.style.display = "none";
    app.style.display = "flex";
  });
})();
</script>
</body>
</html>
